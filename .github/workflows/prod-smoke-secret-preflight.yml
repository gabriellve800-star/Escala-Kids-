name: Pré-publicação — validar credencial de teste de produção
on:
  push:
    branches: [qa/convites-20261111]
    paths:
      - ".github/workflows/prod-smoke-secret-preflight.yml"
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    env:
      PROD_SUPABASE_SECRET_KEY: ${{ secrets.PROD_SUPABASE_SECRET_KEY }}
    steps:
      - name: Verificar apenas presença e formato; não acessar a produção
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PROD_SUPABASE_SECRET_KEY" != sb_secret_* ]]; then
            echo "::error::PROD_SMOKE_SECRET_AUSENTE: crie PROD_SUPABASE_SECRET_KEY com a Secret Key do projeto de PRODUÇÃO, apenas no cofre GitHub."
            exit 1
          fi
          echo "PROD_SMOKE_SECRET_READY: chave disponível para testar e limpar contas sintéticas sem divulgar o valor."
