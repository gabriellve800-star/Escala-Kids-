name: Auditoria Escala Kids
on:
  push:
    branches: [main, 'qa/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Executar somente testes unitarios sem tocar no Supabase de producao
        run: npm run test:unit
